/* different  between var, let, and const


One-line answer: `var` is function-scoped and hoisted to `undefined`; `let`/`const` are block-scoped, 
hoisted but uninitialized (TDZ). `let` can be reassigned, `const` cannot (reference only).

Why this matters (beginner-friendly)

Choosing the right declaration prevents scope leaks, redeclaration bugs, and subtle hoisting issues—
especially in loops and async callbacks. 



The concept in depth

- 1 Scope: `var` → function scope; `let`/`const` → block scope (`{}`).

- 2 Hoisting: All three are hoisted; only `var` is initialized to `undefined`. `let`/`const` live in the 
  Temporal Dead Zone until their declaration line executes.

- 3 Declaration Rules: `var` allows redeclaration in the same scope; `let`/`const` do not.

- 4 Reassignment: `var` and `let` allow reassignment; `const` does not. For objects/arrays, the binding
  is constant but properties/elements may change
  
Common pitfalls & misconceptions
  
- Thinking `const` makes the object immutable (it only freezes the binding).
- Using `var` in loops with async callbacks causes late binding bugs.
- Assuming `let`/`const` aren't hoisted—they are, but remain uninitialized (TDZ).
  
Internal mechanics (how JS engines/spec handle this)

- Declarations form bindings in the current Lexical Environment.
- `var` creates a property on the Variable Environment and is set to `undefined` at environment 
creation.
- `let`/`const` bindings exist but remain uninitialized until the declaration executes; access before 
that throws ReferenceError.

When to use / avoid

- Prefer `const` by default; use `let` when you know the value will change.
- Avoid `var` in modern code unless maintaining legacy code.
  
Practice questions

1. What happens when you access a `let` variable before its declaration?
2. Why can you modify a `const` object's properties but not reassign it?
3. Rewrite the loop below to log 0, 1, 2:

*/

<!-- 📌 1. Scope Differences -->

/* 
🕰 Step 1: Synchronous vs Asynchronous

Synchronous code → runs immediately, line by line.
Asynchronous code → scheduled to run later.

Example: for loop executes synchronously, but setTimeout schedules callbacks asynchronously.

🕰 Step 2: Event Queue / Task Queue

When you call setTimeout, the browser registers the callback with its timer system.
After the delay (even 0 ms), the callback is placed into the event queue.
The event loop processes that queue only after synchronous code finishes.
That’s why callbacks run after the loop completes

🔎 Step 3: Debugging with var


for (var i = 0; i < 3; i++) {
  debugger; // pause here
  setTimeout(() => console.log("var i:", i), 0);

}

What happens:

First pause → i = 0.
Second pause → i = 1.
Third pause → i = 2.
Loop ends → i = 3.

Now callbacks run:

var i: 3
var i: 3
var i: 3

👉 var is function‑scoped, so one binding is reused across all iterations.

🔎 Step 4: Debugging with let

for (let j = 0; j < 3; j++) {
  debugger; // pause here
  setTimeout(() => console.log("let j:", j), 0);
}

What happens:

First pause → j = 0.
Second pause → j = 1.
Third pause → j = 2.

Now callbacks run:


let j: 0
let j: 1
let j: 2

👉 let is block‑scoped, so a new binding is created for each iteration.

🔑 Step 5: Why the Difference?

var → one binding reused.
let → fresh binding per iteration.
setTimeout → runs later, so it captures whatever binding exists when executed.

🧩 Step 6: Closure Fix with var

for (var i = 0; i < 3; i++) {
  (function(x) {
    setTimeout(() => console.log("closure i:", x), 0);
  })(i);
}

Output:

closure i: 0
closure i: 1
closure i: 2

👉 Each iteration passes its own copy of i into the closure, so the callback remembers the correct value.

✅ Final Recap

setTimeout → delays execution, callbacks run after loop finishes.
var → one binding, callbacks log final value.
let → new binding per iteration, callbacks log correct values.
Closures with var → capture the value at each iteration, fixing the issue.

 */

// Using var → one binding shared
for (var i = 0; i < 3; i++) {
  setTimeout(() => console.log("var i:", i), 0);
}
// Output: var i: 3, 3, 3

// Using let → new binding per iteration
for (let j = 0; j < 3; j++) {
  setTimeout(() => console.log("let j:", j), 0);
}
// Output: let j: 0, 1, 2



// 📌 2. Hoisting Differences

console.log(a); // undefined
var a = 5;

console.log(bb); // ReferenceError (TDZ)
let bb = 5;

console.log(c); // ReferenceError (TDZ)
const c = 5;


// 📌 3. Declaration Rules 

// var redeclaration ✅
var x = 10;
var x = 20; // works

// let redeclaration ❌
let uy = 10;
let uy = 20; // SyntaxError

// let + var ❌
let z = 10;
var z = 20; // SyntaxError

// const must initialize ❌
const a; // SyntaxError: Missing initializer
const b = 100;
b = 200; // TypeError: Assignment to constant variable


// 📌4 Reassignment - Const Behavior (Immutable Binding, Mutable Object)

const user = { name: "Alice" };

user.name = "Bob"; // ✅ allowed (object mutation)

// user = {}; // ❌ TypeError: Assignment to constant variable
