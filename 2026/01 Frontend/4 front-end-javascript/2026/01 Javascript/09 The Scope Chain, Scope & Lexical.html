<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Scope Chain, Scope & Lexical
        Environment</title>
</head>

<body>
    <script>

        // Definition: Scope determines where variables and functions are accessible in your code.


        // Global Scope: Variables declared outside any function or block; accessible everywhere.

        // Function Scope: Variables declared inside a function; accessible only within that function.

        // Block Scope: Introduced with let and const; variables declared inside {} are accessible only within that block.
		
		

        debugger;
        // CASE 1
        function a() {
            console.log(b); // 10
        }
        var b = 10;
        a();

        // CASE 2
        function aa() {
            cc();
            function cc() {
                console.log(bb); // 10
            }
        }
        var bb = 10;
        aa();

        // CASE 03 

        function aaa() {
            ccc();
            function ccc() {
                var bbb = 90;
                console.log(bbb);
            }
        }
        var bbb = 10;
        aaa();

        // CASE 04

        function aaaa() {
            var bbbb = 10;
            cccc();
            function cccc() {
                console.log(bbbb);
            }
        }
        aaaa();
        console.log(bbbb);
		


	 

	 /* 
	 
	 Lexical Scope :
	 
	 Lexical scope means that a function's scope is determined by its physical placement in the source code — not where it’s called from.
	 
	 function outer() {
	  let name = "Chetan";
	  function inner() {
		console.log(name); // Accessing variable from outer scope
	  }
	  return inner;
	}
	const fn = outer();
	fn(); // Output: "Chetan"

	
	Explaination :
	
	inner() is defined inside outer(), so it lexically gets access to name, even when it's called later from outside.
    Think of lexical scope like the function carrying its own backpack — wherever it goes, it still has access to the stuff (variables)
	that were available at the place it was born.
	
	*/
    </script>
</body>

</html>
