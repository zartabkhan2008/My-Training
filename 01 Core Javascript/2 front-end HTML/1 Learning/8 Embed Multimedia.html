<!-- Here are 8 HTML5 tags used to embed multimedia content, listed without a table:

<audio> – Embeds sound content like music or podcasts.
<video> – Embeds video files with optional controls and subtitles.
<source> – Specifies multiple media sources for <audio> or <video>.
<track> – Adds subtitles or captions to <video> and <audio>.
<embed> – Embeds external content like PDFs or Flash (legacy).
<object> – Embeds multimedia like images, videos, or Java applets.
<iframe> – Embeds another HTML page, often used for videos or maps.
<picture> – Provides multiple image sources for responsive design.

 -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML5 Multimedia Tags Example</title>
</head>
<body>
  <h2>HTML5 Multimedia Embedding Examples</h2>

  <!-- 1. <audio> -->
  <h3>Audio Example</h3>
  <audio controls>
    <source src="sample-audio.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- 2. <video> -->
  <h3>Video Example</h3>
  <video width="320" height="240" controls>
    <source src="sample-video.mp4" type="video/mp4">
    <track src="subtitles.vtt" kind="subtitles" srclang="en" label="English">
    Your browser does not support the video tag.
  </video>

  <!-- 3. <source> inside audio and video shown above -->

  <!-- 4. <track> shown inside video above -->

  <!-- 5. <embed> -->
  <h3>Embed PDF Example</h3>
  <embed src="sample.pdf" type="application/pdf" width="500" height="400">

  <!-- 6. <object> -->
  <h3>Object Tag Example</h3>
  <object data="sample.pdf" type="application/pdf" width="500" height="400">
    PDF cannot be displayed.
  </object>

  <!-- 7. <iframe> -->
  <h3>Iframe Example (YouTube)</h3>
  <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
          title="YouTube video player" frameborder="0" allowfullscreen>
  </iframe>

  <!-- 8. <picture> -->
  <h3>Responsive Image Example</h3>
  <picture>
    <source srcset="image-large.jpg" media="(min-width: 800px)">
    <source srcset="image-small.jpg" media="(max-width: 799px)">
    <img src="fallback.jpg" alt="Responsive image">
  </picture>
</body>
</html>
