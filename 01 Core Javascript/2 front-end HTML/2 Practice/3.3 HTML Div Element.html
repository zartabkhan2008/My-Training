<!-- 
The <div> element is used as a container for other HTML elements.
The <div> element is by default a block element, meaning that it takes all available width, and comes with linebreaks before and after.
The <div> element has no required attributes, but style, class and id are common.
The <div> element is often used to group sections of a web page together. 
-->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>The element is used as a container for other HTML elements.

  </h1>
  <div>
    <div>
      <table border="1">
        <tr>
          <th>ID</th>
          <th>NAME</th>
          <th>AGE</th>
          <th>CITY</th>

        </tr>
        <tr>
          <td>1</td>
          <td>KHAN</td>
          <td>12</td>
          <td>MUMBAI</td>

        </tr>
      </table>
    </div>
    <img src="../2 Practice/img/5.jpg" alt="my image">
    <h2>London</h2>
    <p>London is the capital city of England.</p>
    <p>London has over 9 million inhabitants.</p>
  </div>
</body>

</html>
