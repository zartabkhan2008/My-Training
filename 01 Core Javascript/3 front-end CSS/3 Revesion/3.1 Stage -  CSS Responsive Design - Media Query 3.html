🔵 Stage 3: Responsive Design

Media Queries: Adapt styles based on screen size, orientation, and resolution.
Units and Breakpoints: Use em, rem, %, vh, vw, and define breakpoints for devices.
Mobile-first Design: Prioritize mobile styling and scale up for larger screens.


1. What is Responsive Design?

A design approach that adapts content to different screen sizes and devices.
Ensures usability and aesthetics across phones, tablets, laptops, and desktops.

2. Mobile-First Strategy

Start with styles for small screens.
Add enhancements for larger screens using media queries.

3. Responsive Units

em and rem: scale with font size.

%: relative to parent element.
vh and vw: relative to viewport height/width.
