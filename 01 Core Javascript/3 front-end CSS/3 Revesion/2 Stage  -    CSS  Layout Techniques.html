<!-- 
 🧭 Positioning

CSS positioning controls how elements are placed in the document flow.

Static: Default positioning; elements follow the normal document flow.
Relative: Moves an element relative to its original position.
Absolute: Positions an element relative to its nearest positioned ancestor.
Fixed: Anchors an element to the viewport; it stays in place during scrolling.

🧱 Float and Clear

Legacy layout method, still useful in specific scenarios.
Float: Moves elements to the left or right, allowing text to wrap around.
Clear: Prevents elements from wrapping around floated elements.

🧩 Flexbox

Ideal for one-dimensional layouts (row or column).
Flexible containers: Use display: flex to activate Flexbox.
Alignment: Control spacing with justify-content and align-items.


🧮 CSS Grid

Perfect for two-dimensional layouts (rows and columns).
Grid-based designs: Use display: grid and define rows/columns.
Placement control: Use grid-template-areas, grid-column, and grid-row.
