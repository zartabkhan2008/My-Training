<!-- 
 🧭 Positioning

CSS positioning controls how elements are placed in the document flow.

Static: Default positioning; elements follow the normal document flow.
Relative: Moves an element relative to its original position.
Absolute: Positions an element relative to its nearest positioned ancestor.
Fixed: Anchors an element to the viewport; it stays in place during scrolling.



-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- 🧭Positioning -->
    <h1> 🧭Positioning</h1>

    <!-- Float and Clear -->
    <h1>🧱 Float and Clear</h1>

    <!-- Flexbox -->
    <h1>🧩 Flexbox</h1>

    <!-- CSS Grid -->
    <h1>🧮 CSS Grid</h1>
</body>

</html>
