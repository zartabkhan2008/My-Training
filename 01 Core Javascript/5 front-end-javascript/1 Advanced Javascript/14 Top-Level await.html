<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Top-Level Await Example</title>
</head>
<body>
  <h1>Top-Level Await Demo</h1>
  <div id="output">Loading data...</div>

  <!-- Use type="module" to enable top-level await -->
  <script type="module">
    // ✅ Top-level await is allowed here because this is a module

    // Define an async function to fetch data from a public API
    async function fetchUserData() {
      const response = await fetch('https://jsonplaceholder.typicode.com/users/1');
      const user = await response.json();
      return user;
    }

    // Use top-level await to get the data
    const userData = await fetchUserData();

    // Display the result in the HTML
    const outputDiv = document.getElementById('output');
    outputDiv.textContent = `User Name: ${userData.name}, Email: ${userData.email}`;
  </script>
</body>
</html>
