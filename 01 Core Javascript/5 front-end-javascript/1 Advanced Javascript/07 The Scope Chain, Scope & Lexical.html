<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Scope Chain, Scope & Lexical
        Environment</title>
</head>

<body>
    <script>

        // Definition: Scope determines where variables and functions are accessible in your code.


        // Global Scope: Variables declared outside any function or block; accessible everywhere.

        // Function Scope: Variables declared inside a function; accessible only within that function.

        // Block Scope: Introduced with let and const; variables declared inside {} are accessible only within that block.
        debugger;
        // CASE 1
        function a() {
            console.log(b); // 10
        }
        var b = 10;
        a();

        // CASE 2
        function aa() {
            cc();
            function cc() {
                console.log(bb); // 10
            }
        }
        var bb = 10;
        aa();

        // CASE 03 

        function aaa() {
            ccc();
            function ccc() {
                var bbb = 90;
                console.log(bbb);
            }
        }
        var bbb = 10;
        aaa();

        // CASE 04

        function aaaa() {
            var bbbb = 10;
            cccc();
            function cccc() {
                console.log(bbbb);
            }
        }
        aaaa();
        console.log(bbbb);
    </script>
</body>

</html>
