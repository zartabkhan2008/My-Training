<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logical Operators Demo</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .output { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>JavaScript Logical Operators: ??, ||, ?.</h1>
  <div class="output" id="themeOutput"></div>
  <div class="output" id="emailOutput"></div>
  <div class="output" id="smsOutput"></div>
  <div class="output" id="languageOutput"></div>

  <!-- Use type="module" to enable top-level await and modern syntax -->
  <script type="module">
    // Sample user settings object with some missing or falsy values
    const userSettings = {
      theme: null,               // null value
      notifications: {
        email: false,            // falsy value
        sms: undefined           // undefined value
      },
      preferences: undefined     // completely missing
    };

    // 1️⃣ Nullish Coalescing (??)
    // Returns "light" because theme is null (not set)
    const selectedTheme = userSettings.theme ?? "light";

    // 2️⃣ Logical OR (||)
    // Returns true because email is false (falsy)
    const emailNotifications = userSettings.notifications.email || true;

    // 3️⃣ Optional Chaining (?.) + Nullish Coalescing
    // Returns "not set" because sms is undefined
    const smsNotifications = userSettings.notifications?.sms ?? "not set";

    // 4️⃣ Optional Chaining with deeply nested access
    // Returns "English" because preferences is undefined
    const languagePreference = userSettings.preferences?.language ?? "English";

    // Display results in the HTML
    document.getElementById("themeOutput").textContent = `Theme: ${selectedTheme}`;
    document.getElementById("emailOutput").textContent = `Email Notifications Enabled: ${emailNotifications}`;
    document.getElementById("smsOutput").textContent = `SMS Notifications: ${smsNotifications}`;
    document.getElementById("languageOutput").textContent = `Language Preference: ${languagePreference}`;
  </script>
</body>
</html>
