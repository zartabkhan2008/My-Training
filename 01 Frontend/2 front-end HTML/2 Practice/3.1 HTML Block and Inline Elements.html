<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Block and Inline Tags Example</title>
  <style>
    .highlight { color: blue; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Block-level tags -->
   <h1>Block-level tags</h1>
  <div>
    <h1>Welcome to My Page</h1>
    <p>This is a paragraph demonstrating block-level structure.</p>
    <ul>
      <li>Item One</li>
      <li>Item Two</li>
    </ul>
    <table border="1">
      <tr><th>Name</th><th>Age</th></tr>
      <tr><td>Alice</td><td>30</td></tr>
    </table>
  </div>

  <!-- Inline-level tags -->

  <h1>Inline-level tags</h1>
  <p>
    This is <span class="highlight">inline text</span> with a 
    <a href="#">link</a>, some <strong>bold</strong> text, 
    <em>emphasized</em> words, and an image: 
    <img src="https://via.placeholder.com/50" alt="Placeholder Image">
  </p>

</body>
</html>
