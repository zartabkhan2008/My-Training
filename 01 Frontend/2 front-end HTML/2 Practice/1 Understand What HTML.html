<!-- 

Defination :

HTML (HyperText Markup Language) is the foundational language used to create and structure content on the web.

Key Concepts of HTML

HTML stands for HyperText Markup Language: It's not a programming language but a markup language used to define the structure of web pages.

HTML elements: These are the building blocks of HTML, typically written as tags like <h1>, <p>, <a>, etc.

Tags and attributes:

Tags define elements (e.g., <p> for paragraph).

Attributes provide additional information (e.g., <img src="image.jpg" alt="description">).

Document structure:

<!DOCTYPE html>: Declares the document type.

<html>: Root element.

<head>: Contains metadata like title and links to stylesheets.

<body>: Contains the visible content of the page.

    🌐 What HTML Is Used For
Creating web pages: HTML is the backbone of all websites.

Embedding media: You can add images, videos, and audio.

Linking content: Use hyperlinks to connect pages and resources.

Structuring forms: HTML enables user input through forms.

Why Learn HTML?
It's the first step in web development.

It works alongside CSS (for styling) and JavaScript (for interactivity).

It's essential for building websites, blogs, portfolios, and web apps. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
</html>
