<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Calculator</title>
</head>
<body>
  <h1>Calculator Example</h1>
  
  <p>Open your browser console to see results.</p>
  
  <script>
    // Calculator function
    function calculator(a, b, operator) {
        
      if (operator === "add") {
        return a + b;
      } else if (operator === "subtract") {
        return a - b;
      } else if (operator === "multiply") {
        return a * b;
      } else if (operator === "divide") {
        if (b !== 0) {
          return a / b;
        } else {
          return "Error: Division by zero!";
        }
      } else {
        return "Invalid operator!";
      }
    }

    // Example usage

    debugger;
    console.log("Addition:", calculator(10, 5, "add"));
    console.log("Subtraction:", calculator(10, 5, "subtract"));
    console.log("Multiplication:", calculator(10, 5, "multiply"));
    console.log("Division:", calculator(10, 5, "divide"));
  </script>
</body>
</html>
