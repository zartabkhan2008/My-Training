Throttling Implementation

Throttling is a technique used to improve the performance of applications
limiting the rate of function calls

If the function is getting called continuously, 
We can execute the function once in the given time interval with the help of 
Throttling to optimize the performance of applications

💡Debouncing vs Throttling-

In Debouncing, the attached function will be executed only after the given time once the user stops calling the event.
While in Throttling, the attached function will be executed only once in a given time interval.

💡Which technique to use in a particular scenario?

For Search bar, It’s recommended to use Debouncing technique as it will give better user experience
For Shooting game, Browser resizing and Scrolling feeds, It’s recommended to use Throttling technique.

Question : A function executes too many times on scroll — how will you optimize it?

Ans - Throttling
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

    </style>
</head>

<body>

    <h2>Throttle: Button Click</h2>
    <button id="clickBtn">Click Me!</button>

    <script>

        function throttle(fn, interval) {
            let lastTime = 0;
            return function (...args) {
                const now = Date.now();
                if (now - lastTime >= interval) {
                    lastTime = now;
                    fn.apply(this, args);
                }
            };
        }
        const handleClick = throttle(() => {
            console.log('Throttled: Button clicked');
        }, 2000); // Only allow click every 2 seconds
        document.getElementById('clickBtn').addEventListener('click', handleClick);

    </script>
</body>

</html>
