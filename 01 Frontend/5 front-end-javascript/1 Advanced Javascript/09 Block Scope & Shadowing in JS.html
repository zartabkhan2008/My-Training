<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // Definition: Variables declared with let or const are only accessible within the block {} they are defined in.

        {
            let x = 10;
            const y = 20;
        }
        // console.log(x); // ❌ ReferenceError
        // console.log(y); // ❌ ReferenceError

        // Common Block Scopes:
        // if, for, while statements
        // Any {} block, even standalone

        // 🕶️ Shadowing

        // Definition: Shadowing occurs when a variable in an inner scope has the same name as one in an outer scope.
        //  The inner variable temporarily hides (or “shadows”) the outer one within its scope.

        // Example 1: Function Scope Shadowing

        let name = "Ramzan";

        function greet() {
            let name = "Ali"; // shadows outer 'name'
            console.log(name); 
        }

        greet();
        console.log(name); 

        // ✅ Example 2: Block Scope Shadowing

        let score = 90;

        {
            let score = 75; // shadows outer 'score'
            console.log(score); // ✅ 75
        }

        console.log(score); // ✅ 90

        // ✅ Example 3: Shadowing with var (Not True Shadowing)

        var age = 30;

        {
             age = 25; // overwrites outer 'age'
            console.log(age); // ✅ 25
        }

        console.log(age); // ✅ 25 (not shadowed — overwritten!)

        // ✅ Example 4: Shadowing in Loops

        let i = 100;

        for (let i = 0; i < 3; i++) {
            console.log(i); // ✅ 0, 1, 2
        }

        console.log(i); // ✅ 100

        // ✅ Example 5: Shadowing in Nested Functions

        let message = "Hello";

        function outer() {
            let message = "Hi";

            function inner() {
                let message = "Hey";
                console.log(message); // ✅ "Hey"
            }

            inner();
            console.log(message); // ✅ "Hi"
        }

        outer();
        console.log(message); // ✅ "Hello"

    </script>
</body>

</html>
